<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mehrag Faiz">
    <meta name="theme-color" content="#0a0a0a">
    <title>Mehrag Faiz</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #f0f0f0;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
            height: 100dvh;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 0;
        }

        .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100dvh;
            gap: 10px;
            user-select: none;
        }

        .greeting {
            font-size: 0.85rem;
            color: #555;
            letter-spacing: 0.02em;
            opacity: 0;
            animation: fadeIn 0.8s ease 0.3s forwards;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 500;
            letter-spacing: -0.02em;
            opacity: 0;
            animation: fadeIn 0.8s ease 0.1s forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .hint {
            position: fixed;
            bottom: 28px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.7rem;
            color: #333;
            opacity: 0;
            animation: fadeIn 1s ease 1.5s forwards;
        }

        a.email {
            display: inline-block;
            color: #aaa;
            text-decoration: none;
            font-size: 0.8rem;
            padding: 10px 24px;
            border: 1px solid #222;
            border-radius: 100px;
            opacity: 0;
            animation: fadeIn 0.8s ease 0.5s forwards;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            margin-top: 6px;
            background: transparent;
            position: relative;
            overflow: hidden;
        }

        a.email::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 100px;
            background: linear-gradient(135deg, rgba(255,255,255,0.06), transparent);
            opacity: 0;
            transition: opacity 0.4s;
        }

        a.email:hover, a.email:active {
            color: #fff;
            border-color: #444;
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.05);
        }

        a.email:hover::before, a.email:active::before {
            opacity: 1;
        }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <div class="content">
        <p class="greeting" id="greeting"></p>
        <h1>Mehrag Faiz</h1>
        <a class="email" href="mailto:faiz.mehrag@gmail.com">Get in touch</a>
    </div>
    <p class="hint">tap anywhere</p>

    <script>
        // greeting
        const h = new Date().getHours();
        document.getElementById('greeting').textContent =
            h < 6 ? 'Up late?' : h < 12 ? 'Good morning.' : h < 18 ? 'Good afternoon.' : 'Good evening.';

        // particles
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        let W, H;
        const particles = [];

        function resize() {
            W = canvas.width = innerWidth;
            H = canvas.height = innerHeight;
        }
        resize();
        addEventListener('resize', resize);

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 3 + 1;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.life = 1;
                this.decay = Math.random() * 0.015 + 0.008;
                this.size = Math.random() * 2.5 + 0.5;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.98;
                this.vy *= 0.98;
                this.life -= this.decay;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.life * 0.4})`;
                ctx.fill();
            }
        }

        function burst(x, y) {
            for (let i = 0; i < 30; i++) {
                particles.push(new Particle(x, y));
            }
        }

        function loop() {
            ctx.clearRect(0, 0, W, H);
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) particles.splice(i, 1);
            }
            requestAnimationFrame(loop);
        }
        loop();

        // interaction
        addEventListener('click', e => burst(e.clientX, e.clientY));
        addEventListener('touchstart', e => {
            for (const t of e.touches) burst(t.clientX, t.clientY);
        }, { passive: true });
    </script>
</body>
</html>
